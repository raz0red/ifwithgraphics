version: "3"

# IFWG build/dev tasks.
# Only requirement: https://taskfile.dev — everything else runs inside Docker.
#
# Common workflows:
#   task validate        Run all linters and format checks (JS + Go)
#   task build           Validate, build WASM, and bundle minified player JS
#   task build:explorer  Build native dfrotz and explorer binary
#   task site            Rebuild the marketing site's static HTML (site/index.html)
#   task dist            Assemble the combined deploy (site at /, player at /player/) in dist/
#   task serve           Serve the player only at http://localhost:5173 (engine/game-page dev)
#   task preview         Build + serve the full combined deploy at http://localhost:5174
#   task clean           Remove build artifacts
#
# Granular lint/format:
#   task lint            ESLint on player JS
#   task fmt             Prettier format check on player JS
#   task fmt:write       Auto-format player JS with Prettier
#   task tools:fmt       gofmt check on all Go under tools/
#   task tools:lint      go vet + staticcheck on all Go under tools/
#   task zcompare        Compare Z-machine rooms to bfs.json

vars:
  EMSDK_IMAGE:  emscripten/emsdk:3.1.1
  NODE_IMAGE:   node:20-alpine
  NGINX_IMAGE:  nginx:alpine
  GO_IMAGE:     golang:1.24-bookworm
  ALPINE_RUN:   docker run --rm -v "{{.ROOT_DIR}}:/repo" alpine
  EMSDK_RUN:    docker run --rm -v "{{.ROOT_DIR}}:/repo" -w /repo/wasm {{.EMSDK_IMAGE}}
  NODE_RUN:     docker run --rm -v "{{.ROOT_DIR}}/player/src:/src" -w /src {{.NODE_IMAGE}}
  SITE_RUN:     docker run --rm -v "{{.ROOT_DIR}}/site:/site" -w /site {{.NODE_IMAGE}}
  GO_RUN:       docker run --rm -v "{{.ROOT_DIR}}:/repo" -w /repo/tools/explorer {{.GO_IMAGE}}

tasks:
  default:
    silent: true
    cmd: task --list

  validate:
    desc: Run all linters and format checks (JS ESLint + Prettier + Go fmt/vet/staticcheck)
    cmds:
      - task: lint
      - task: fmt
      - task: tools:fmt
      - task: tools:lint

  build:
    desc: Validate, build WASM interpreter, and bundle minified player JS
    cmds:
      - task: validate
      - task: build:wasm
      - task: build:js

  site:
    desc: "Rebuild the marketing site's static HTML (site/index.html) from data/games.json + sections"
    cmd: "{{.SITE_RUN}} node build.js"

  dist:
    desc: "Assemble the combined deploy in dist/ — marketing site at /, player app at /player/"
    cmds:
      - task: build:wasm
      - task: build:js
      - task: site
      - "{{.ALPINE_RUN}} sh -c '\
          rm -rf /repo/dist && \
          mkdir -p /repo/dist/player/wasm /repo/dist/player/prompt /repo/dist/player/context && \
          cp /repo/site/index.html /repo/dist/ && \
          cp -r /repo/site/css /repo/site/js /repo/site/assets /repo/dist/ && \
          cp /repo/player/index.html /repo/player/src/player.css /repo/dist/player/ && \
          cp -r /repo/player/src/js /repo/dist/player/js && \
          cp /repo/player/src/wasm/ifwg.js /repo/player/src/wasm/ifwg.wasm /repo/dist/player/wasm/ && \
          cp /repo/player/src/dist/ifwg-player.js /repo/dist/player/ && \
          cp /repo/player/src/prompt/* /repo/dist/player/prompt/ && \
          cp /repo/player/src/context/* /repo/dist/player/context/ && \
          cp -r /repo/player/games /repo/dist/player/games && \
          cp -r /repo/player/images /repo/dist/player/images \
        '"

  explore:
    desc: "Walk a game and write rooms JSON — task explore stories=C:\\path story=game.z5 [walkthrough=tools/explorer/games/zork1/walkthroughs/zork1.txt] [out=tools/explorer/games/zork1/bfs.json] [loop=1]"
    vars:
      out:      '{{.out | default "tools/explorer/games/zork1/bfs.json"}}'
      wt_flag:  '{{if .walkthrough}}-walkthrough /repo/{{.walkthrough}}{{end}}'
      lp_flag:  '{{if .loop}}-loop{{end}}'
    cmd: >
      docker run --rm
      -v "{{.ROOT_DIR}}:/repo"
      -v "{{.stories}}:/stories:ro"
      -w /repo/tools/explorer
      {{.GO_IMAGE}}
      ./bin/explorer --frotz ./frotz/bin/dfrotz --out /repo/{{.out}} {{.wt_flag}} {{.lp_flag}} /stories/{{.story}}

  build:explorer:
    desc: Build native dfrotz and explorer binary
    cmds:
      - "{{.GO_RUN}} make -B -C frotz"
      - "{{.GO_RUN}} sh -c 'go mod tidy && mkdir -p bin && go build -o bin/explorer .'"

  zcompare:
    desc: "Compare Z-machine rooms to bfs.json — task zcompare story=player/games/zork3/zork3.z3 [bfs=tools/explorer/games/zork3/bfs.json]"
    vars:
      bfs: '{{.bfs | default "tools/explorer/games/zork3/bfs.json"}}'
    cmd: >
      docker run --rm
      -v "{{.ROOT_DIR}}:/repo"
      -w /repo
      {{.GO_IMAGE}}
      sh -c 'make -B -C /repo/wasm/ztools/source infodump txd && go run /repo/tools/zcompare/main.go --infodump /repo/wasm/ztools/source/infodump --txd /repo/wasm/ztools/source/txd /repo/{{.story}} /repo/{{.bfs}}'

  imagegen:
    desc: "Batch-generate room images — task imagegen [rooms=tools/explorer/games/zork1/bfs.json] [out=player/images] [concurrency=3] [limit=0] [model=gpt-image-2-2026-04-21]"
    vars:
      rooms:       '{{.rooms | default "tools/explorer/games/zork1/bfs.json"}}'
      out:         '{{.out | default "player/images"}}'
      concurrency: '{{.concurrency | default "3"}}'
      limit:       '{{.limit | default "0"}}'
      model:       '{{.model | default "gpt-image-2-2026-04-21"}}'
    cmd: >
      docker run --rm
      -v "{{.ROOT_DIR}}:/repo"
      -w /repo/tools/imagegen
      -e OPENAI_API_KEY
      {{.GO_IMAGE}}
      sh -c 'apt-get update -qq && apt-get install -y -q libwebp-dev && go run . -refs /repo/player/src/prompt -context /repo/player/src/context -out /repo/{{.out}} -concurrency {{.concurrency}} -limit {{.limit}} -model {{.model}} /repo/{{.rooms}}'

  lint:
    desc: Run ESLint on player JS
    cmd: "{{.NODE_RUN}} sh -c 'npm install --silent && npm run lint'"

  fmt:
    desc: Check Prettier formatting on player JS (fail if any file needs it)
    cmd: "{{.NODE_RUN}} sh -c 'npm install --silent && npm run fmt'"

  fmt:write:
    desc: Auto-format player JS with Prettier
    cmd: "{{.NODE_RUN}} sh -c 'npm install --silent && npm run fmt:write'"

  tools:fmt:
    desc: Check Go formatting under tools/ (fail if any file needs gofmt)
    cmd: >
      docker run --rm
      -v "{{.ROOT_DIR}}:/repo"
      -w /repo
      -e GOFLAGS=-buildvcs=false
      {{.GO_IMAGE}}
      sh -c 'cd /repo/tools/explorer && gofmt -l . | grep . && exit 1 || true &&
             cd /repo/tools/imagegen && gofmt -l . | grep . && exit 1 || true &&
             cd /repo/tools/zcompare && gofmt -l . | grep . && exit 1 || true'

  tools:lint:
    desc: Run go vet and staticcheck on all Go code under tools/
    cmd: >
      docker run --rm
      -v "{{.ROOT_DIR}}:/repo"
      -w /repo
      -e GOFLAGS=-buildvcs=false
      {{.GO_IMAGE}}
      sh -c 'go install honnef.co/go/tools/cmd/staticcheck@v0.6.0 &&
             echo "=== tools/explorer ===" &&
             cd /repo/tools/explorer && go vet ./... && staticcheck ./... &&
             echo "=== tools/imagegen ===" &&
             cd /repo/tools/imagegen && go vet ./... && staticcheck ./... &&
             echo "=== tools/zcompare ===" &&
             cd /repo/tools/zcompare && go vet ./... && staticcheck ./...'

  build:wasm:
    internal: true
    cmd: "{{.EMSDK_RUN}} make install"

  build:js:
    internal: true
    cmd: "{{.NODE_RUN}} sh -c 'npm install --silent && npm run build'"

  serve:
    desc: "Serve the player only at http://localhost:{port} (default 5173) — engine/game-page dev. Override: task serve port=8787"
    vars:
      port: '{{.port | default "5173"}}'
    cmd: docker run --rm -p {{.port}}:80 -v "{{.ROOT_DIR}}/player:/usr/share/nginx/html:ro" -v "{{.ROOT_DIR}}/tools/nginx.conf:/etc/nginx/conf.d/default.conf:ro" {{.NGINX_IMAGE}}

  preview:
    desc: "Build the combined deploy and serve it at http://localhost:{port} (default 5174) — the integrated site + player"
    vars:
      port: '{{.port | default "5174"}}'
    cmds:
      - task: dist
      - docker run --rm -p {{.port}}:80 -v "{{.ROOT_DIR}}/dist:/usr/share/nginx/html:ro" {{.NGINX_IMAGE}}

  clean:
    desc: Remove build artifacts
    cmds:
      - "{{.EMSDK_RUN}} make clean"
      - "{{.ALPINE_RUN}} rm -rf /repo/dist /repo/player/src/dist /repo/wasm/ztools/source/infodump /repo/wasm/ztools/source/txd /repo/wasm/ztools/source/*.o"
